# 运行和自动化测试都加载本文件。
spring:
  datasource:
    url: jdbc:mysql://117.72.43.169:3306/consult_agent?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&sessionVariables=innodb_lock_wait_timeout=5
    username: root
    password: "replace-with-the-registration-test-password"
    hikari:
      connection-init-sql: SET time_zone = '+08:00'
  data:
    redis:
      host: 117.72.43.169
      port: 6379
      password: "replace-with-the-registration-test-password"
rocketmq:
  name-server: 117.72.43.169:9876
model:
  api-key: "replace-with-the-registration-model-key"
  # 第二个模型。超时重试主模型后仍超时，才会调用它。名称留空则直接走食材规则。
  fallback-model-name: ""
  fallback-base-url: ""
  fallback-api-key: ""
consult:
  vector:
    host: 154.8.236.238
    port: 19530
    api-key: "replace-with-dashscope-embedding-key"
