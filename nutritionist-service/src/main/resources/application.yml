server:
  port: 18091

spring:
  application:
    name: nutritionist
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/nutritionist?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: nutritionist
    password: nutritionist
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

consult:
  auth:
    jwt-secret: consult-dev-jwt-secret-key-32bytes!
    jwt-ttl-hours: 168
    # 营养服务无登录接口；只放行健康检查
    open-paths:
      - /actuator/health
    open-path-prefixes: []
    staff-only-prefixes: []

nutritionist:
  identity:
    mode: fake
    base-url: http://127.0.0.1:18082
  security:
    # 本地直连服务时注入测试账号；经网关或生产必须关闭
    dev-principal:
      enabled: true
      account-id: dev-account
      role: patient

management:

  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
