server:
  port: 18091
  tomcat:
    max-connections: 10000
    accept-count: 500
    threads:
      max: 200

spring:
  application:
    name: nutritionist
  config:
    import:
      - optional:file:./config/application-local.yml
      - optional:file:../config/application-local.yml
      - optional:file:../../config/application-local.yml
  threads:
    virtual:
      enabled: true
  datasource:
    # 与挂号同一个库 consult_agent。测试环境地址和密码只写 gitignore 的 config/application-local.yml。
    url: jdbc:mysql://127.0.0.1:3306/consult_agent?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&sessionVariables=innodb_lock_wait_timeout=5
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 3000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ""
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 与挂号共用 consult_agent，库里已有挂号的表。从 0 起补营养服务自己的表。
    baseline-on-migrate: true
    baseline-version: 0

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 查询结果要按记录参数名对列，别名才能映射到不同的字段名。
    arg-name-based-constructor-auto-mapping: true
    # 可空参数必须写成 SQL NULL。默认 OTHER 会被 MySQL 拒绝。
    jdbc-type-for-null: "NULL"

consult:
  auth:
    jwt-secret: consult-dev-jwt-secret-key-32bytes!
    jwt-ttl-hours: 168
    # 营养服务无登录接口；只放行健康检查
    open-paths:
      - /actuator/health
      - /actuator/health/liveness
      - /actuator/health/readiness
    open-path-prefixes: []
    staff-only-prefixes: []
  # 与挂号同一套 Langfuse 项目；密钥只写 application-local.yml
  observability:
    enabled: true
    capture-payloads: true
    langfuse:
      public-url: http://117.72.43.169:3000
      project-id: consult-agent
      retention-days: 30
      public-key: ""
      secret-key: ""
  redisson:
    enabled: true
  vector:
    enabled: true
    host: 127.0.0.1
    port: 19530
    api-key: ""
    base-url: https://dashscope.aliyuncs.com
    model: qwen3-vl-embedding
    rerank-model: gte-rerank-v2
    rerank-enabled: true
    # 与 PassedRerank.BUDGET_MS 对齐；超时回退规则序
    rerank-timeout-ms: 500

model:
  api-key: ""
  base-url: https://api.deepseek.com
  model-name: deepseek-v4-pro
  timeout-ms: 2000
  acquire-wait-ms: 200
  # 主模型超时后再打主模型的次数；0=不重试。TwoModelChain 读取此配置。
  timeout-retries: 1
  # 单回合模型墙钟预算（毫秒）；编排层可用来跳过后续抽取。
  turn-deadline-ms: 12000
  # 主模型仍超时则调用兜底；名称为空则走食材规则。密钥空则沿用主密钥。
  fallback-model-name: ""
  fallback-base-url: ""
  fallback-api-key: ""

nutritionist:
  recall:
    degrade:
      # 软约束可降（NO_FEASIBLE 可去菜系）；点名菜系 SCALAR_EMPTY 仍 fail-closed
      enabled: true
    rerank:
      # 主料硬过滤后的百炼重排；失败/超时不挡主链路
      enabled: true
  # 异步补 chunk；测试/本地默认关，避免启动卡死远程全表
  chunk-seeder:
    enabled: false
  clinical-record:
    base-url: ${CLINICAL_RECORD_URL:}
    token: ${CLINICAL_RECORD_TOKEN:consult-internal}
  identity:
    mode: fake
    base-url: http://127.0.0.1:18082
    internal-token: consult-internal
  security:

    # 本地直连服务时注入测试账号；经网关或生产必须关闭
    dev-principal:
      enabled: true
      account-id: dev-account
      role: patient

management:
  otlp:
    metrics:
      export:
        # 避免默认打 localhost:4318 刷屏；traces 走下方 Collector
        enabled: false
  tracing:
    export:
      enabled: true
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # 与挂号共用测试机 Collector → Langfuse
          endpoint: http://117.72.43.169:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis

# 与挂号测试环境同一台中间件。配了 name-server 后，接入客户端才会建生产者。
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: nutritionist-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2
