server:
  port: 18091

spring:
  application:
    name: nutritionist
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/nutritionist?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: nutritionist
    password: nutritionist
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

nutritionist:
  identity:
    mode: fake
    base-url: http://127.0.0.1:18081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
