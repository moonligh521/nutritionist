server:
  port: 18091

spring:
  application:
    name: nutritionist
  config:
    import:
      - optional:file:./config/application-local.yml
      - optional:file:../config/application-local.yml
      - optional:file:../../config/application-local.yml
  threads:
    virtual:
      enabled: true
  datasource:
    # 测试环境与挂号共用同一台 MySQL、Redis、RocketMQ。库名用 nutritionist，不写入 consult_agent。
    # 测试环境地址和密码只写 gitignore 的 config/application-local.yml。
    url: jdbc:mysql://127.0.0.1:3306/nutritionist?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&sessionVariables=innodb_lock_wait_timeout=5
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ""
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration

consult:
  auth:
    jwt-secret: consult-dev-jwt-secret-key-32bytes!
    jwt-ttl-hours: 168
    # 营养服务无登录接口；只放行健康检查
    open-paths:
      - /actuator/health
    open-path-prefixes: []
    staff-only-prefixes: []

nutritionist:
  identity:
    mode: fake
    base-url: http://127.0.0.1:18082
    internal-token: consult-internal
  security:

    # 本地直连服务时注入测试账号；经网关或生产必须关闭
    dev-principal:
      enabled: true
      account-id: dev-account
      role: patient

management:

  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# 与挂号测试环境同一台中间件。配了 name-server 后，接入客户端才会建生产者。
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: nutritionist-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2
