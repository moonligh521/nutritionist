spring:
  datasource:
    url: jdbc:h2:mem:nutritionist;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

consult:
  auth:
    jwt-secret: consult-dev-jwt-secret-key-32bytes!
    open-paths:
      - /actuator/health
    open-path-prefixes: []
    staff-only-prefixes: []

nutritionist:
  identity:
    mode: fake
  security:
    dev-principal:
      enabled: true
      account-id: test-account

